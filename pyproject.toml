[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "0.1.0"
description = "Offline scanner and drift lock for AI agent skills: catch prompt injection, credential access, and exfiltration before you install a skill."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jeni" }]
keywords = ["security", "agent-skills", "claude-code", "prompt-injection", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
skillguard = "skillguard.cli:main"

[project.urls]
Homepage = "https://github.com/asad3856/skillguard"
Issues = "https://github.com/asad3856/skillguard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillguard = ["py.typed"]
